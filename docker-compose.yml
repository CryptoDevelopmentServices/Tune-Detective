version: '3.9'
services:
  mongo:
    image: mongo:6.0
    container_name: tune-detective-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    container_name: tune-detective-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/tune-detective
      - ACOUSTID_API_KEY=${ACOUSTID_API_KEY}
    volumes:
      - ./backend:/usr/src/app
    depends_on:
      - mongo

  frontend:
    build: ./frontend
    container_name: tune-detective-frontend
    restart: always
    ports:
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
      - "19006:19006"
    volumes:
      - ./frontend:/usr/src/app
    depends_on:
      - backend

volumes:
  mongo-data:

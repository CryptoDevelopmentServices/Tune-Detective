services:
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      SQLITE_PATH: /app/data/tune-detective.sqlite
      PORT: 5000
    volumes:
      - tune-detective-data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  tune-detective-data:

version: '3'
services:
  mongo:
    image: mongo
    restart: always
    ports:
      - "27017:27017"
  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/tunedetective
      - ACOUSTID_KEY=your_acoustid_api_key
    depends_on:
      - mongo
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
